<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>多元题型练习｜道德复习小达人</title><style>:root{font-family:KaiTi,STKaiti,'Kaiti SC',serif;color:#26344b;background:#f6f8ff}*{box-sizing:border-box}body{margin:0}header{background:#fff;padding:18px 5%;box-shadow:0 2px 14px #d9e1f3}main{max-width:900px;margin:auto;padding:24px 16px}h1{font-size:clamp(25px,5vw,36px)}.card{background:white;border-radius:22px;padding:23px;margin:18px 0;box-shadow:0 4px 18px #dce3f055}button,select,input,textarea{font:inherit;font-size:19px;border:2px solid #d5ddf0;border-radius:12px;padding:12px;background:#fff;max-width:100%}button{cursor:pointer;background:#7463d9;color:white;border:0;margin:5px 6px 5px 0}button.secondary{background:#edf0fb;color:#343b69}select,input,textarea{width:100%;margin:8px 0}label{display:block;margin:12px 0;font-size:19px}p{font-size:19px;line-height:1.8}.muted{color:#667085}.feedback{padding:14px;border-radius:12px;background:#eef9ef;margin-top:12px;line-height:1.8}a{color:#5345ae}.score{font-weight:bold;color:#5142a7}#questions{display:grid;gap:12px} .tag{background:#f0edff;border-radius:20px;padding:6px 12px;display:inline-block}@media(max-width:600px){.card{padding:16px}button{width:100%}}</style></head><body><header><a href="index.html">← 返回复习首页</a>　<span class="score">📘 多元题型强化练习</span></header><main><h1>📝 全年多元题型训练</h1><p>按照课本14个主题练习价值填充、情境配对和简答表达。填充题可自行核对答案，简答题提供参考方向，不会机械地判定学生写法。</p><div class="card"><label for="unit">选择复习单元</label><select id="unit"></select><button onclick="render()">开始练习</button><button class="secondary" onclick="randomUnit()">随机挑战</button></div><div id="questions"></div></main><script src="data.js"></script><script>
'use strict';const U=window.REVISION_DATA.units;const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));$('unit').innerHTML=U.map((u,i)=>`<option value="${i}">第${i+1}单元 ${esc(u.title)}</option>`).join('');let current=0;function randomUnit(){$('unit').value=Math.floor(Math.random()*U.length);render()}function render(){current=Number($('unit').value);const u=U[current];$('questions').innerHTML=`<div class="card"><span class="tag">第一题 · 价值填充</span><h2>${esc(u.title)}</h2><p>本单元重点学习的道德价值是什么？</p><input id="fill" autocomplete="off" placeholder="写出道德价值名称" aria-label="填写道德价值"><button onclick="checkFill()">核对答案</button><div id="fillResult" aria-live="polite"></div></div><div class="card"><span class="tag">第二题 · 情境配对</span><h2>选出符合价值的做法</h2><p>${esc(u.example)}</p><label for="match">你会怎样做？</label><select id="match"><option value="">请选择</option>${choices(current).map((x,i)=>`<option value="${x.i}">${esc(x.text)}</option>`).join('')}</select><button onclick="checkMatch()">提交答案</button><div id="matchResult" aria-live="polite"></div></div><div class="card"><span class="tag">第三题 · 简答表达</span><h2>写一写，想一想</h2><p>在校园里，你可以怎样实践「${esc(u.value)}」？为什么要这样做？</p><textarea id="written" rows="4" placeholder="我会……因为……" aria-label="简答题作答"></textarea><button onclick="showReference()">查看参考答案与自评重点</button><div id="writtenResult" aria-live="polite"></div></div>`}function choices(i){let arr=[{i:i,text:U[i].action}];for(let n=1;n<=3;n++){let j=(i+n*3)%U.length;if(j===i)j=(j+1)%U.length;arr.push({i:j,text:U[j].action})}return arr.sort((a,b)=>a.text.localeCompare(b.text,'zh'))}function checkFill(){let ans=$('fill').value.trim().replace(/\s/g,''),u=U[current];$('fillResult').innerHTML=`<div class="feedback">${ans===u.value?'✅ 正确！':'🌷 请再记一记。'} 本单元的道德价值是：<b>${esc(u.value)}</b>。<br>${esc(u.summary)}</div>`}function checkMatch(){let v=$('match').value;if(!v){$('matchResult').textContent='请先选择一个做法。';return}let ok=Number(v)===current;let u=U[current];$('matchResult').innerHTML=`<div class="feedback">${ok?'✅ 配对正确！':'🌷 这也是一种值得学习的行为，但请寻找最符合本题情境的做法。'}${ok?'<br>'+esc(u.explanation):''}</div>`}function showReference(){let u=U[current],txt=$('written').value.trim();$('writtenResult').innerHTML=`<div class="feedback"><b>参考表达：</b>我会${esc(u.action)}，因为${esc(u.explanation)}<br><b>自我检查：</b>① 有没有写出具体做法？② 有没有说明原因？③ 是否符合「${esc(u.value)}」？<br>${txt?'你已写下自己的答案，请对照以上三点检查。':'请先尝试自己写答案，再根据参考表达练习。'}<br><small>简答题可能有多个合理答案，参考表达不是唯一答案。</small></div>`}render();
</script></body></html>
