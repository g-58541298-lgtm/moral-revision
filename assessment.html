<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>评估题型强化｜道德复习小达人</title><style>
:root{font-family:KaiTi,STKaiti,'DFKai-SB',serif;color:#2d3650;background:#f7f5ff}*{box-sizing:border-box}body{margin:0;font-size:19px}header{background:white;padding:16px 5%;box-shadow:0 2px 10px #ddd}main{max-width:940px;margin:auto;padding:20px 14px 80px}h1{font-size:clamp(26px,5vw,37px)}.card{background:white;border-radius:20px;padding:22px;margin:16px 0;box-shadow:0 4px 16px #d5d0ec55}button,select,input,textarea{font:inherit;font-size:19px;border-radius:12px;padding:12px}button{border:0;background:#7359c9;color:white;cursor:pointer;margin:4px}button:disabled{opacity:.5;cursor:default}.light{background:#ede9fa;color:#403374}select,input,textarea{border:2px solid #cfc8e9;width:100%;margin:8px 0}textarea{min-height:110px}.option{display:block;width:100%;text-align:left;background:#f2efff;color:#28324a;margin:8px 0;border:2px solid transparent}.option.active{border-color:#6552b8;background:#e1d9ff}.feedback{background:#f1f8f3;border-radius:12px;padding:13px;line-height:1.7;margin-top:12px}.muted{color:#626b80}.tag{display:inline-block;background:#fff0c8;border-radius:20px;padding:5px 12px;font-size:16px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex:1;min-width:180px}.hidden{display:none}a{color:#5444a0}.steps{list-style:none;padding:0}.steps li{padding:10px;background:#f4f2ff;border-radius:12px;margin:7px 0}.steps button{padding:6px 12px;font-size:16px}.progress{height:12px;background:#e7e1f7;border-radius:12px;overflow:hidden}.bar{height:100%;background:#7b65d5;transition:width .2s}@media(max-width:600px){.card{padding:16px}.row>*{min-width:100%}button{min-height:44px}}
</style></head><body><header><a href="index.html">← 返回首页</a>　🌟 全年评估题型强化</header><main><h1>📝 多元题型模拟与练习</h1><p class="muted">依据课本14个单元主题设计原创练习：价值填充、情境选择、简答表达和步骤排序。练习模式可核对提示；模拟模式交卷后才显示答案。</p><div class="card" id="setup"><div class="row"><label>复习范围<select id="scope"><option value="all">全年14个单元</option></select></label><label>练习模式<select id="mode"><option value="practice">练习（即时反馈）</option><option value="exam">模拟评估（交卷后批改）</option></select></label><label>题型<select id="kind"><option value="all">全部题型</option><option value="fill">价值填充</option><option value="choice">情境选择</option><option value="written">简答表达</option><option value="order">步骤排序</option></select></label></div><button onclick="start()">开始练习</button><p class="muted">模拟评估会抽取最多20题。填充题采用严格关键词核对；简答题需学生根据参考答案自评，不自动给出虚假的分数。</p></div><div id="session" class="hidden"><div class="card"><div id="progressLabel"></div><div class="progress"><div class="bar" id="bar"></div></div></div><div id="question" class="card"></div><div class="row"><button class="light" onclick="previous()" id="prev">上一题</button><button onclick="next()" id="next">下一题</button><button class="light" onclick="finish()" id="finish">提交 / 结束</button></div></div><div id="results" class="hidden card"></div></main><script src="data.js"></script><script src="assessment_data.js"></script><script>
'use strict';const $=x=>document.getElementById(x),units=window.REVISION_DATA.units,all=window.ASSESSMENT_ITEMS;const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));units.forEach((u,i)=>{$('scope').insertAdjacentHTML('beforeend',`<option value="${i}">第${i+1}单元 ${escapeHtml(u.title)}</option>`)});let set=[],answers={},idx=0,exam=false,done=false;const shuffled=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);function start(){let scope=$('scope').value,kind=$('kind').value;exam=$('mode').value==='exam';set=shuffled(all.filter(q=>(scope==='all'||q.unit===+scope)&&(kind==='all'||q.type===kind))).slice(0,exam?20:99);if(!set.length){alert('这个范围暂时没有此题型。');return}answers={};idx=0;done=false;$('setup').classList.add('hidden');$('results').classList.add('hidden');$('session').classList.remove('hidden');render()}function record(v){answers[set[idx].id]=v;render()}function currentAnswer(){return answers[set[idx].id]}function render(){let q=set[idx],a=currentAnswer();$('progressLabel').textContent=`第 ${idx+1} / ${set.length} 题 · ${units[q.unit].title}`;$('bar').style.width=((idx+1)/set.length*100)+'%';let type={fill:'价值填充',choice:'情境选择',written:'简答表达',order:'步骤排序'}[q.type];let s=`<span class="tag">${type}</span><h2>${escapeHtml(q.prompt)}</h2>`;if(q.type==='fill')s+=`<input id="answer" aria-label="填写答案" value="${escapeHtml(a||'')}" placeholder="填写道德价值名称"><button onclick="saveText()">保存答案</button>`;if(q.type==='written')s+=`<textarea id="answer" aria-label="填写简答" placeholder="我会……因为……">${escapeHtml(a||'')}</textarea><button onclick="saveText()">保存答案</button>`;if(q.type==='choice')s+=q.options.map((x,i)=>`<button class="option ${a===i?'active':''}" onclick="record(${i})">${'ABCD'[i]}. ${escapeHtml(x)}</button>`).join('');if(q.type==='order'){let order=Array.isArray(a)?a:[];s+=`<p class="muted">依照合理顺序，点击以下步骤：</p>`+q.steps.map((x,i)=>`<button class="option" onclick="chooseStep(${i})">${order.includes(i)?'✓ '+(order.indexOf(i)+1)+'. ':''}${escapeHtml(x)}</button>`).join('')+`<button class="light" onclick="record([])">清除顺序</button>`}if(!exam){s+=`<button class="light" onclick="showFeedback()">核对 / 查看提示</button><div id="feedback"></div>`} $('question').innerHTML=s;$('prev').disabled=idx===0;$('next').disabled=idx===set.length-1;$('finish').textContent=exam?'提交模拟评估':'结束练习'}function saveText(){answers[set[idx].id]=$('answer').value.trim();render()}function chooseStep(i){let a=Array.isArray(currentAnswer())?[...currentAnswer()]:[];if(!a.includes(i))a.push(i);record(a)}function previous(){idx--;render()}function next(){idx++;render()}function norm(x){return String(x||'').replace(/[\s，。,.！!]/g,'').toLowerCase()}function isCorrect(q,a){if(q.type==='choice')return a===q.answer;if(q.type==='fill')return norm(a)===norm(q.answer)||q.aliases.some(x=>norm(a)===norm(x));if(q.type==='order')return JSON.stringify(a)===JSON.stringify(q.answer);return null}function feedback(q,a){let ok=isCorrect(q,a);let msg=ok===null?'简答题不自动判分。请对照参考表达自我检查。':ok?'✅ 正确！':'🌱 再想一想，核对下面的解释。';let ref=q.type==='written'?`参考表达：${q.sample}<br>检查：①有具体做法 ②有合理原因 ③符合道德价值`:q.type==='order'?`合理顺序：${q.answer.map(i=>q.steps[i]).join(' → ')}<br>${q.explain}`:q.type==='choice'?`正确选项：${'ABCD'[q.answer]}。${q.explain}`:`参考答案：${q.answer}。${q.explain}`;return `<div class="feedback"><b>${msg}</b><br>${escapeHtml(ref).replace(/&lt;br&gt;/g,'<br>')}</div>`}function showFeedback(){let q=set[idx],a=currentAnswer();$('feedback').innerHTML=feedback(q,a)}function finish(){if(exam&&!confirm('确定交卷吗？未完成的题目将视为未作答。'))return;done=true;$('session').classList.add('hidden');$('results').classList.remove('hidden');let graded=set.filter(q=>q.type!=='written'),correct=graded.filter(q=>isCorrect(q,answers[q.id])).length,attempted=set.filter(q=>answers[q.id]!==undefined&&answers[q.id]!==''&&(!Array.isArray(answers[q.id])||answers[q.id].length)).length;let summary=`<h2>🎉 本次复习完成</h2><p>已作答：${attempted}/${set.length}　｜　客观题：${correct}/${graded.length} 正确</p><p class="muted">简答题不计入自动正确率；请逐题对照参考答案。此分数不是学校正式评估成绩。</p>`;summary+=set.map((q,i)=>`<details class="card"><summary>${i+1}. ${escapeHtml(q.prompt)} ${q.type==='written'?'（自评）':isCorrect(q,answers[q.id])?'✅':'🔁'}</summary><p>你的作答：${escapeHtml(q.type==='choice'?(answers[q.id]===undefined?'未作答':q.options[answers[q.id]]):q.type==='order'?(answers[q.id]||[]).map(j=>q.steps[j]).join(' → '):(answers[q.id]||'未作答'))}</p>${feedback(q,answers[q.id])}</details>`).join('');summary+='<button onclick="restart()">重新选择练习</button>';$('results').innerHTML=summary;try{let history=JSON.parse(localStorage.getItem('moral_assessment_v4')||'[]');history.unshift({date:new Date().toISOString(),correct,total:graded.length,answered:attempted});localStorage.setItem('moral_assessment_v4',JSON.stringify(history.slice(0,10)))}catch(e){}}function restart(){$('results').classList.add('hidden');$('setup').classList.remove('hidden')}
</script></body></html>
