<!doctype html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>道德复习小达人 · 三年级</title><style>
:root{--ink:#34415b;--pink:#ff79a8;--purple:#7766ce;--bg:#f6f5ff;--green:#259e75}*{box-sizing:border-box}body{margin:0;background:linear-gradient(130deg,#fef0f7,#eef7ff 55%,#fff8e9);color:var(--ink);font-family:KaiTi,'STKaiti','Kaiti SC','DFKai-SB',serif;font-size:19px;min-height:100vh}button{font:inherit;cursor:pointer}header{background:white;padding:15px 5%;box-shadow:0 3px 16px #9a96bb20;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.logo{font-size:24px;font-weight:bold;color:#735ac1}.stat{background:#fff0c7;padding:8px 16px;border-radius:30px;font-weight:bold}main{max-width:1100px;margin:auto;padding:26px 16px 70px}.hero{background:linear-gradient(110deg,#dcd2ff,#ffe0ed);border-radius:28px;padding:26px;display:flex;align-items:center;justify-content:space-between;gap:12px}.hero h1{font-size:34px;margin:0 0 10px}.hero p{margin:0;line-height:1.7}.mascot{font-size:65px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}.btn{border:0;border-radius:16px;padding:12px 18px;background:var(--purple);color:white;box-shadow:0 4px 0 #51429b}.btn.alt{background:white;color:var(--purple);box-shadow:0 3px 0 #ded8f5}.btn:disabled{opacity:.45;cursor:not-allowed}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:16px}.card{background:white;border-radius:23px;padding:20px;border:2px solid #eee9fc;box-shadow:0 8px 20px #b6aac522}.card h3{margin:8px 0;font-size:23px}.card p{font-size:17px;line-height:1.6}.unit-icon{font-size:38px}.pill{background:#fff0f6;color:#ad4874;border-radius:99px;padding:5px 12px;font-size:15px;display:inline-block}.panel{max-width:830px;margin:auto;background:white;padding:26px;border-radius:26px;box-shadow:0 9px 25px #b6aac52e}.panel h2{font-size:29px}.info{background:#f2efff;border-radius:17px;padding:15px;line-height:1.8;margin:12px 0}.progress{height:13px;background:#ece9f4;border-radius:30px;overflow:hidden;margin:14px 0}.bar{height:100%;background:linear-gradient(90deg,#75cfab,#8b7be4)}.option{display:block;width:100%;text-align:left;background:#fff;border:2px solid #e7e2f5;border-radius:17px;margin:10px 0;padding:15px;color:var(--ink);line-height:1.5}.option.selected{background:#e9e4ff;border-color:#7864d5}.option.correct{background:#e0f7e9;border-color:#27a579}.option.wrong{background:#fff0f1;border-color:#e7818d}.feedback{padding:17px;background:#f0f8f2;border-radius:18px;line-height:1.8;margin-top:15px}.small{font-size:16px;color:#777}.empty{text-align:center;padding:30px}.review-row{border-left:5px solid #8b7be4;padding:12px 16px;margin:12px 0;background:#f7f4ff;border-radius:12px}.review-row b{display:block}.mini{font-size:15px;color:#5b6476}.tag{display:inline-block;background:#fce7f0;padding:4px 10px;border-radius:15px;font-size:15px}.hide{display:none}footer{text-align:center;font-size:14px;padding:25px;color:#78758c}@media(max-width:520px){body{font-size:18px}.hero h1{font-size:26px}.hero{padding:20px}.mascot{font-size:44px}.panel{padding:17px}.panel h2{font-size:24px}.btn{padding:11px 13px}}
</style></head><body><header><div class="logo">🌈 道德复习小达人</div><div class="stat" id="stat">⭐ 0　✓ 0/112</div></header><main id="app"></main><div style="text-align:center;padding:12px"><a href="assessment.html" style="display:inline-block;background:#6d5bd2;color:white;padding:15px 22px;border-radius:14px;font-size:20px;text-decoration:none">✏️ 新增：填充、配对、简答练习 →</a></div><footer>三年级道德教育全年复习 · 原创练习题依据课本主题设计 · 学习进度仅储存于本机</footer><script src="data.js"></script><script>
'use strict';const {units,questions}=window.REVISION_DATA;const app=document.getElementById('app'),icons=['🎊','🤝','📚','💝','🌷','🙏','🌱','⚖️','🦁','💎','🍎','🧩','🌼','🕊️'];const key='moral3_revision_v1';let state;try{state=JSON.parse(localStorage.getItem(key))||{}}catch(e){state={}}state.solved=state.solved||{};state.wrong=state.wrong||{};state.examHistory=state.examHistory||[];state.attempts=state.attempts||{};state.mastered=state.mastered||{};let session=null;function save(){try{localStorage.setItem(key,JSON.stringify(state))}catch(e){}}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function updateStat(){document.getElementById('stat').textContent=`⭐ ${Object.keys(state.solved).length}　✓ ${Object.keys(state.solved).length}/${questions.length}`}function progress(n,total){return `<div class="progress"><div class="bar" style="width:${Math.round(100*n/Math.max(1,total))}%"></div></div>`}function home(){session=null;updateStat();const count=Object.keys(state.solved).length;app.innerHTML=`<div class="hero"><div><h1>🌟 三年级道德教育<br>全年评估复习</h1><p>14个主题关卡 · ${questions.length}道原创练习 · 模拟评估 · 错题强化</p></div><div class="mascot">👧🏻📖</div></div><div class="actions"><button class="btn" onclick="startExam()">📝 综合模拟评估</button><button class="btn alt" onclick="showWrong()">🔍 我的错题本（${questions.filter(q=>state.wrong[q.id]&&!state.mastered[q.id]).length}）</button><button class="btn alt" onclick="showOverview()">📌 考前速记</button><button class="btn alt" onclick="showReport()">📊 我的复习分析</button><button class="btn alt" onclick="startQuick()">⚡ 10题快速挑战</button></div><div class="card" style="margin-bottom:20px"><b>全年复习进度：${count}/${questions.length} 题</b>${progress(count,questions.length)}<span class="small">答对一次即可获得星星；错题可反复练习。</span></div><h2>🗺️ 选择复习单元</h2><div class="grid">${units.map((u,i)=>{let n=questions.filter(q=>q.unit===i&&state.solved[q.id]).length;return `<div class="card"><div class="unit-icon">${icons[i]}</div><span class="pill">第${i+1}单元 · ${n}/8 ⭐</span><h3>${esc(u.title)}</h3><p>核心价值：${esc(u.value)}</p>${progress(n,8)}<button class="btn" onclick="startUnit(${i})">${n===8?'再次复习':'开始闯关'} →</button></div>`}).join('')}</div>`}function showOverview(){app.innerHTML=`<div class="panel"><button class="btn alt" onclick="home()">← 返回首页</button><h2>📌 全年考前速记</h2><p>先记住价值名称，再想想生活中怎样实践。</p>${units.map((u,i)=>`<div class="info"><b>${i+1}. ${esc(u.title)}｜${esc(u.value)}</b><div>${esc(u.summary)}</div><div class="small">实践例子：${esc(u.action)}</div></div>`).join('')}</div>`}function startUnit(i){let arr=questions.filter(q=>q.unit===i);session={type:'practice',unit:i,arr,pos:0,selected:-1,locked:false,hint:false};renderQuestion()}function shuffle(a){let r=[...a];for(let i=r.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]]}return r}function startExam(n=30){let shuffled=shuffle(questions);session={type:'exam',arr:shuffled.slice(0,n),pos:0,answers:{},submitted:false};renderQuestion()}function startQuick(){startExam(10)}function showWrong(){const arr=questions.filter(q=>state.wrong[q.id]&&!state.mastered[q.id]);if(!arr.length){app.innerHTML=`<div class="panel empty"><h2>🎉 暂时没有错题</h2><p>先去完成一些单元练习吧！</p><button class="btn" onclick="home()">返回首页</button></div>`;return}session={type:'wrong',arr,pos:0,selected:-1,locked:false,hint:false};renderQuestion()}function showReport(){const rows=units.map((u,i)=>{let qs=questions.filter(q=>q.unit===i),done=qs.filter(q=>state.solved[q.id]).length,wrong=qs.filter(q=>state.wrong[q.id]&&!state.mastered[q.id]).length,tries=qs.reduce((n,q)=>n+(state.attempts[q.id]||0),0);return {u,i,done,wrong,tries}});let weak=[...rows].filter(x=>x.wrong>0).sort((a,b)=>b.wrong-a.wrong);let last=state.examHistory.slice(-5).reverse();app.innerHTML=`<div class="panel"><button class="btn alt" onclick="home()">← 返回首页</button><h2>📊 我的复习分析</h2><p>已掌握 ${Object.keys(state.solved).length}/${questions.length} 题 · 待强化 ${questions.filter(q=>state.wrong[q.id]&&!state.mastered[q.id]).length} 题</p><h3>优先复习</h3>${weak.length?weak.slice(0,4).map(x=>`<div class="review-row"><b>第${x.i+1}单元 ${esc(x.u.title)}</b>待强化 ${x.wrong} 题 <button class="btn alt" onclick="startUnit(${x.i})">复习本单元</button></div>`).join(''):'<p>目前没有待强化的错题。继续挑战新题吧！</p>'}<h3>各单元掌握情况</h3>${rows.map(x=>`<div class="review-row"><b>${x.i+1}. ${esc(x.u.title)} · ${esc(x.u.value)}</b><span class="mini">已答对 ${x.done}/8 · 待强化 ${x.wrong} · 练习提交 ${x.tries} 次</span>${progress(x.done,8)}</div>`).join('')}<h3>最近模拟评估</h3>${last.length?last.map(h=>`<p>📝 ${esc(h.date.slice(0,10))}：${h.correct}/${h.total}（${Math.round(h.correct/h.total*100)}分）</p>`).join(''):'<p>尚未进行模拟评估。</p>'}<p class="mini">记录只保存在此浏览器。更换设备或清除浏览器资料后，进度可能无法恢复。</p></div>`}function renderQuestion(){const s=session,q=s.arr[s.pos],exam=s.type==='exam';updateStat();let selected=exam?(s.answers[q.id]??-1):s.selected;app.innerHTML=`<div class="panel"><button class="btn alt" onclick="home()">← 返回首页</button><h2>${exam?'📝 全年模拟评估':s.type==='wrong'?'🔍 错题强化':icons[s.unit]+' '+esc(units[s.unit].title)}</h2><div class="small">第 ${s.pos+1} / ${s.arr.length} 题　${exam?'独立作答，提交后查看解析':'答对获得 ⭐'}</div>${progress(s.pos+1,s.arr.length)}<h3 style="line-height:1.8;white-space:pre-line">${esc(q.question)}</h3><div id="choices">${q.options.map((o,i)=>`<button class="option ${selected===i?'selected':''} ${!exam&&s.locked&&i===q.answer?'correct':''}" onclick="choose(${i})" ${!exam&&s.locked?'disabled':''}>${'ABCD'[i]}. ${esc(o)}</button>`).join('')}</div><div class="actions">${exam?`<button class="btn" onclick="nextExam()">${s.pos===s.arr.length-1?'完成并提交':'下一题 →'}</button><button class="btn alt" onclick="prevExam()" ${s.pos===0?'disabled':''}>← 上一题</button><button class="btn alt" onclick="submitExam()">立即交卷</button>`:`<button class="btn alt" onclick="toggleHint()">💡 ${s.hint?'隐藏提示':'思考提示'}</button><button class="btn" onclick="checkAnswer()" ${selected<0||s.locked?'disabled':''}>提交答案</button>${s.locked?`<button class="btn" onclick="nextPractice()">${s.pos===s.arr.length-1?'完成复习':'下一题 →'}</button>`:''}`}</div><div id="hint">${!exam&&s.hint?`<div class="info">💡 ${esc(q.tip)}</div>`:''}</div><div id="feedback"></div></div>`}function choose(i){let s=session;if(!s)return;if(s.type==='exam'){s.answers[s.arr[s.pos].id]=i;renderQuestion();return}if(s.locked)return;s.selected=i;renderQuestion()}function toggleHint(){session.hint=!session.hint;renderQuestion()}function checkAnswer(){const s=session,q=s.arr[s.pos];if(s.selected<0||s.locked)return;state.attempts[q.id]=(state.attempts[q.id]||0)+1;if(s.selected===q.answer){s.locked=true;state.solved[q.id]=true;if(state.wrong[q.id])state.mastered[q.id]=true;save();renderQuestion();document.getElementById('feedback').innerHTML=`<div class="feedback">🎉 答对了！获得 ⭐<br><b>答案：${'ABCD'[q.answer]}</b><br>${esc(q.explanation)}</div>`;updateStat()}else{state.wrong[q.id]=true;state.mastered[q.id]=false;save();renderQuestion();document.getElementById('feedback').innerHTML=`<div class="feedback" style="background:#fff1f1">🌷 再想一想！${esc(q.tip)}<br>可以重新选择答案。</div>`}}function nextPractice(){if(session.pos===session.arr.length-1){let title=session.type==='wrong'?'错题复习完成':'单元闯关完成';app.innerHTML=`<div class="panel empty"><div style="font-size:64px">🏆🌟</div><h2>${title}！</h2><p>你已经完成本轮练习，继续保持！</p><button class="btn" onclick="home()">返回首页</button></div>`;return}session.pos++;session.selected=-1;session.locked=false;session.hint=false;renderQuestion()}function prevExam(){if(session.pos>0){session.pos--;renderQuestion()}}function nextExam(){const s=session;if(s.pos<s.arr.length-1){s.pos++;renderQuestion();return}submitExam()}function submitExam(){const s=session;if(!s||s.type!=='exam')return;const answered=s.arr.filter(q=>s.answers[q.id]!==undefined).length;if(answered<s.arr.length&&!confirm(`还有${s.arr.length-answered}道题未作答，确定提交吗？`))return;let correct=0,details=[];for(const q of s.arr){const a=s.answers[q.id];if(a===q.answer){correct++;state.solved[q.id]=true;if(state.wrong[q.id])state.mastered[q.id]=true}else{state.wrong[q.id]=true;state.mastered[q.id]=false}details.push({q,a})}state.examHistory.push({date:new Date().toISOString(),correct,total:s.arr.length});save();session=null;updateStat();app.innerHTML=`<div class="panel"><button class="btn alt" onclick="home()">← 返回首页</button><h2>🏆 模拟评估成绩</h2><h1>${correct} / ${details.length}　${Math.round(correct/details.length*100)}分</h1><p>${correct>=24?'表现不错！继续巩固易错题。':'继续努力！建议复习相关单元后再挑战。'}</p>${progress(correct,details.length)}<h2>📖 答案解析</h2>${details.map(({q,a},i)=>`<div class="info"><b>${i+1}. ${esc(q.question)}</b><br>你的答案：${a===undefined?'未作答':'ABCD'[a]}　｜　正确答案：${'ABCD'[q.answer]} ${a===q.answer?'✅':'❌'}<br>${esc(q.explanation)}</div>`).join('')}<button class="btn" onclick="startExam()">再做一份模拟评估</button></div>`}home();
</script></body></html>
